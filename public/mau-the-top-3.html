<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fdfcf9"><title>Mẫu thẻ Top 1, 2, 3</title>
<style>
:root{--ink:#20201e;--muted:#77756f;--paper:#fdfcf9;--line:#e5e1da;--coral:#ee765f;--gold:#9f6d0d;--silver:#637982;--bronze:#9a4b26}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:13px/1.45 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{width:min(900px,calc(100% - 34px));margin:auto;padding:48px 0 86px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:31px;padding-bottom:22px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:27px;letter-spacing:-.05em;text-wrap:balance}header p{max-width:430px;margin:0;color:var(--muted);font-size:12px;text-align:right}.sample{margin-top:25px}.label{display:flex;align-items:center;gap:10px;margin:0 0 10px;color:#5e5b55;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.label b{width:23px;height:23px;display:grid;place-items:center;border-radius:50%;color:var(--coral);background:#fff0eb;font-size:10px}.label span{color:#97938c;font-weight:500;letter-spacing:0;text-transform:none}.list{display:grid;gap:8px}.card{position:relative;min-height:88px;display:grid;grid-template-columns:38px 46px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 13px;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fffefa;transition:transform .18s,box-shadow .18s}.card:hover{transform:translateY(-2px);box-shadow:0 9px 22px #2b23171a}.rank{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;color:#595752;background:#f3f1ec;font-size:12px;font-weight:800}.logo{width:46px;height:46px;display:grid;place-items:center;border:1px solid #20201e10;border-radius:12px;color:#915142;background:#fff0eb;font-size:15px;font-weight:800}.main{min-width:0}.title{overflow:hidden;margin:0;font-size:13px;letter-spacing:-.02em;white-space:nowrap;text-overflow:ellipsis}.location{display:block;overflow:hidden;margin-top:3px;color:var(--muted);font-size:10px;white-space:nowrap;text-overflow:ellipsis}.stat{margin-top:7px;color:#96928c;font-size:9px}.stat span+span:before{margin:0 7px;color:#d7d1c9;content:"/"}.side{display:flex;align-items:end;flex-direction:column;gap:7px}.price{color:var(--coral);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.action{padding:6px 9px;border:1px solid #ded9d1;border-radius:999px;color:#5b5851;background:#fff;font-size:9px;font-weight:750;white-space:nowrap}@media(prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
/* 01: viền hạng — cường độ giảm dần */.m1 .card:before{position:absolute;top:17px;bottom:17px;left:0;content:""}.m1 .card:nth-child(1):before{width:5px;background:#d6a322}.m1 .card:nth-child(2):before{width:4px;background:#94a8b0}.m1 .card:nth-child(3):before{width:3px;background:#d9a581}.m1 .card:nth-child(1) .rank{width:38px;height:38px;color:#775000;background:#fff0b3}.m1 .card:nth-child(2) .rank{width:35px;height:35px;color:#52646c;background:#e9f1f3}.m1 .card:nth-child(3) .rank{width:32px;height:32px;color:#8d583e;background:#fff4ed}
/* 02: chip huy chương — kích thước và độ đậm giảm dần */.m2 .card{border-radius:12px}.m2 .rank{border-radius:50%;color:#fff}.m2 .card:nth-child(1) .rank{width:38px;height:38px;background:linear-gradient(135deg,#e9c54b,#9f6d0d);box-shadow:0 4px 10px #9f6d0d38}.m2 .card:nth-child(2) .rank{width:35px;height:35px;background:linear-gradient(135deg,#b9cbd0,#61757d)}.m2 .card:nth-child(3) .rank{width:32px;height:32px;background:linear-gradient(135deg,#edc0a1,#ae6c48)}.m2 .card:nth-child(1) .price{color:var(--gold)}.m2 .card:nth-child(2) .price{color:var(--silver)}.m2 .card:nth-child(3) .price{color:var(--bronze)}
/* 03: nhãn đầu hàng — đường viền giảm dần */.m3 .card{border-radius:10px}.m3 .rank{border-radius:8px}.m3 .card:nth-child(1){border:2px solid #e0b73f}.m3 .card:nth-child(1) .rank{width:38px;height:42px;color:#755000;background:#ffe8a0}.m3 .card:nth-child(2){border-color:#c4d4d9}.m3 .card:nth-child(2) .rank{width:35px;height:38px;color:#50636b;background:#e5eff1}.m3 .card:nth-child(3){border-color:#efdfd4}.m3 .card:nth-child(3) .rank{width:32px;height:34px;color:#9b654a;background:#fdf0e8}.m3 .action{border:0;color:#fff;background:#33332f}
/* 04: nền sáng nhẹ — diện tích nhấn giảm dần */.m4 .card{border-color:transparent;box-shadow:0 1px 0 var(--line)}.m4 .card:nth-child(1){background:linear-gradient(90deg,#fff1bf,#fffefa 62%)}.m4 .card:nth-child(2){background:linear-gradient(90deg,#edf5f7,#fffefa 49%)}.m4 .card:nth-child(3){background:linear-gradient(90deg,#fff8f4,#fffefa 36%)}.m4 .rank{border-radius:50%;color:#fff}.m4 .card:nth-child(1) .rank{width:38px;height:38px;background:#c69521}.m4 .card:nth-child(2) .rank{width:35px;height:35px;background:#8299a2}.m4 .card:nth-child(3) .rank{width:32px;height:32px;background:#cd8b63}
/* 05: podium mềm — độ nổi bật giảm dần, không dùng nhãn phủ lên nội dung */.m5 .card:first-child{border:2px solid #d9aa35;background:linear-gradient(105deg,#fff9e2,#fffefa 60%)}.m5 .card:nth-child(2){border-color:#c8d7db;background:linear-gradient(105deg,#f5fafb,#fffefa 48%)}.m5 .card:nth-child(3){border-color:#f0ddd2;background:linear-gradient(105deg,#fffaf7,#fffefa 35%)}.m5 .card:first-child .rank{width:38px;height:38px;color:#674400;background:linear-gradient(135deg,#fff3aa,#d3991e)}.m5 .card:nth-child(2) .rank{width:35px;height:35px;color:#53666f;background:#e2edef}.m5 .card:nth-child(3) .rank{width:32px;height:32px;color:#9c654c;background:#fdf0e8}.m5 .card:first-child .action{border-color:#d8a52e;color:#704b00;background:#fff7d2}.m5 .card:nth-child(2) .action{border-color:#c8d7db;background:#f6fbfc}.m5 .card:nth-child(3) .action{border-color:#f0ddd2;background:#fffaf7}
@media(max-width:620px){.wrap{width:min(100% - 24px,900px);padding-top:30px}header{display:block;margin-bottom:24px}h1{font-size:24px}header p{margin-top:8px;text-align:left}.card{grid-template-columns:36px 42px minmax(0,1fr);grid-template-areas:"rank logo main" "rank logo side";gap:7px 10px;padding:12px}.rank{grid-area:rank}.logo{grid-area:logo;width:42px;height:42px}.main{grid-area:main}.side{grid-area:side;align-items:start;flex-direction:row;justify-content:space-between}.stat{display:none}.m3 .rank{width:36px}}
</style></head><body><main class="wrap"><header><h1>5 hướng UI cho Top 1, 2, 3</h1><p>Giữ nguyên dữ liệu hiển thị. Mẫu 1–4 dùng một thẻ ngang chung cho mọi hạng; mẫu 5 chỉ nhấn mạnh Top 1.</p></header><div id="samples"></div></main>
<script>
const entries=[['1','A','Kính Mắt Ánh Dương','Hồ Chí Minh · 1,248 lượt xem','12.500.000 ₫','Đang dẫn đầu'],['2','O','Optic House','Hà Nội · 986 lượt xem','10.200.000 ₫','Đang xếp hạng 2'],['3','V','Vision Studio','Đà Nẵng · 751 lượt xem','8.800.000 ₫','Đang xếp hạng 3']];
const samples=[['m1','Viền hạng tinh tế','độ dày giảm từ Top 1 đến Top 3'],['m2','Chip huy chương','độ lớn & độ đậm giảm dần'],['m3','Nhãn đầu hàng','đường viền giảm dần theo thứ hạng'],['m4','Highlight nền nhẹ','diện tích nhấn giảm dần'],['m5','Podium mềm','cả ba hạng đều có điểm nhấn']];
document.querySelector('#samples').innerHTML=samples.map(([style,name,note],i)=>`<section class="sample ${style}"><p class="label"><b>0${i+1}</b>${name}<span>— ${note}</span></p><div class="list">${entries.map(([rank,logo,title,location,price,status])=>`<article class="card"><div class="rank">#${rank}</div><div class="logo">${logo}</div><div class="main"><h2 class="title">${title}</h2><span class="location">${location}</span><div class="stat"><span>Kính Mắt</span><span>${status}</span></div></div><div class="side"><strong class="price">${price}</strong><span class="action">Vượt hạng</span></div></article>`).join('')}</div></section>`).join('');
</script></body></html>
